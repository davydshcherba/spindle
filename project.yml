name: Spindle
options:
  bundleIdPrefix: com.spindle
  deploymentTarget:
    # Liquid Glass (glassEffect, GlassEffectContainer, safeAreaBar) needs macOS 26 / iOS 26.
    macOS: "26.0"
    # 26.1: the mini player above the tab bar can be switched off while nothing plays.
    iOS: "26.1"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 defaults for new app projects: everything is @MainActor unless
    # opted out, and nonisolated async functions stay on the caller's actor.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  Spindle:
    type: application
    platform: macOS
    sources:
      - path: Spindle
    settings:
      base:
        PRODUCT_NAME: Spindle
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.Spindle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spindle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: Config/Spindle.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  # The iPhone app. It shares the models, services and view models with the Mac app, and the few
  # views that don't depend on AppKit; its own screens live in SpindleiOS/.
  SpindleiOS:
    type: application
    platform: iOS
    sources:
      - path: Spindle/Models
      - path: Spindle/Services
      - path: Spindle/ViewModels
      - path: Spindle/Platform
        excludes:
          - WindowChrome.swift
      - path: Spindle/App
        excludes:
          - SpindleApp.swift
      - path: Spindle/Views/Theme.swift
      - path: Spindle/Views/Components/ArtworkView.swift
      - path: Spindle/Views/Components/AmbientBackground.swift
      - path: Spindle/Views/Components/CollectionMenu.swift
      - path: Spindle/Views/Components/Controls.swift
      - path: Spindle/Views/Components/CoverEditor.swift
      - path: Spindle/Views/Components/Motion.swift
      - path: Spindle/Views/Components/SeekBar.swift
      - path: Spindle/Views/Components/SheetLayout.swift
      - path: Spindle/Views/Components/VinylDisc.swift
      - path: Spindle/Views/Albums/AlbumEditorSheet.swift
      - path: Spindle/Views/Playlists/PlaylistEditorSheet.swift
      - path: Spindle/Views/Player/EqualizerPanel.swift
      - path: Spindle/Views/Player/PlayPauseButton.swift
      - path: Spindle/Views/Tracks/AddToPlaylist.swift
      - path: Spindle/Views/Tracks/TrackEditorSheet.swift
      - path: SpindleiOS
    info:
      path: SpindleiOS/Info.plist
      properties:
        CFBundleDisplayName: Spindle
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Keeps the music playing with the screen off.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Songs dropped into the Spindle folder in the Files app, and "Open in Spindle".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - org.xiph.flac
              - com.microsoft.waveform-audio
        ITSAppUsesNonExemptEncryption: false
    # The bundle id (the same as the Mac app's, so one purchase could cover both) and the signing
    # team come from here, so a developer's own values can live in Config/Local.xcconfig.
    configFiles:
      Debug: Config/Spindle.xcconfig
      Release: Config/Spindle.xcconfig
    settings:
      base:
        PRODUCT_NAME: Spindle
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # An iPhone app: no "My Mac (Designed for iPad)" or Vision Pro run destination, which would
        # only ask for a signing team. The Mac has its own app.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Drives the iPhone app in the simulator: taps, swipes and long presses.
  SpindleiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpindleiOSUITests
      # Builds tiny tagged songs with covers, the same ones the unit tests use.
      - path: SpindleTests/Fixtures.swift
    dependencies:
      - target: SpindleiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.SpindleiOSUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # XCTestCase's initializers aren't main-actor, so the tests mark `@MainActor` on their methods.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  SpindleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpindleTests
    dependencies:
      - target: Spindle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.SpindleTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Spindle:
    build:
      targets:
        Spindle: all
        SpindleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpindleTests

  SpindleiOS:
    build:
      targets:
        SpindleiOS: all
        SpindleiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpindleiOSUITests
