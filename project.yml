name: Spindle
options:
  bundleIdPrefix: com.spindle
  deploymentTarget:
    # Liquid Glass (glassEffect, GlassEffectContainer, safeAreaBar) needs macOS 26 / iOS 26.
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 defaults for new app projects: everything is @MainActor unless
    # opted out, and nonisolated async functions stay on the caller's actor.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  Spindle:
    type: application
    platform: macOS
    sources:
      - path: Spindle
    settings:
      base:
        PRODUCT_NAME: Spindle
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.Spindle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spindle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: Config/Spindle.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  # The iPhone app. It shares the models, services and view models with the Mac app, and the few
  # views that don't depend on AppKit; its own screens live in SpindleiOS/.
  SpindleiOS:
    type: application
    platform: iOS
    sources:
      - path: Spindle/Models
      - path: Spindle/Services
      - path: Spindle/ViewModels
      - path: Spindle/Platform
        excludes:
          - WindowChrome.swift
      - path: Spindle/App
        excludes:
          - SpindleApp.swift
      - path: Spindle/Views/Theme.swift
      - path: Spindle/Views/Components/ArtworkView.swift
      - path: Spindle/Views/Components/AmbientBackground.swift
      - path: Spindle/Views/Components/Controls.swift
      - path: Spindle/Views/Components/Motion.swift
      - path: Spindle/Views/Components/SeekBar.swift
      - path: Spindle/Views/Components/VinylDisc.swift
      - path: Spindle/Views/Player/PlayPauseButton.swift
      - path: SpindleiOS
    info:
      path: SpindleiOS/Info.plist
      properties:
        CFBundleDisplayName: Spindle
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Keeps the music playing with the screen off.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Songs dropped into the Spindle folder in the Files app, and "Open in Spindle".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Spindle
        # The same id as the Mac app, so one purchase could cover both.
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.Spindle
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SpindleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpindleTests
    dependencies:
      - target: Spindle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spindle.SpindleTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Spindle:
    build:
      targets:
        Spindle: all
        SpindleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpindleTests

  SpindleiOS:
    build:
      targets:
        SpindleiOS: all
    run:
      config: Debug
